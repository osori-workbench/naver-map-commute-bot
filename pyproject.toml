[project]
name = "naver-map-commute-bot"
version = "0.1.0"
description = "NAVER Maps driving ETA and fuel-cost batch for Slack webhooks"
authors = [
    { name = "OsoriAndOmori", email = "skywhite15@korea.ac.kr" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.5",
]

[project.scripts]
naver-map-commute-bot = "naver_map_commute_bot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naver_map_commute_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
